<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Personajes de Star Wars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h3 class="card-title m-0" th:text="${titulo}">Personajes Femeninos de Star Wars (Altura > 160)</h3>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover table-bordered text-center align-middle">
                <thead class="table-primary">
                <tr>
                    <th>Nombre</th>
                    <th>Género</th>
                    <th>Altura (cm)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${personajes}">
                    <td th:text="${p.name}">Leia Organa</td>
                    <td th:text="${p.gender}">female</td>
                    <td th:text="${p.height}">165</td>
                </tr>
                <tr th:if="${#lists.isEmpty(personajes)}">
                    <td colspan="3" class="text-muted">No se encontraron personajes que cumplan con el filtro.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
